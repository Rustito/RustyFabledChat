<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rusty Fabled Chat — OBS Source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-size: 18px;
    --text-color: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6);
    --bubble-bg: transparent;
    --bubble-radius: 0px;
    --bubble-pad: 1px 4px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: 'Inter', 'Segoe UI', 'Noto Sans Arabic', Tahoma, sans-serif;
    font-size: var(--font-size);
    color: var(--text-color);
  }
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
  }
  #chat {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 10px 12px;
    overflow: hidden;
  }
  .tc-msg, .tc-event {
    line-height: 1.45;
    word-wrap: break-word; overflow-wrap: anywhere;
    unicode-bidi: plaintext;
    text-shadow: var(--shadow);
    background: var(--bubble-bg);
    border-radius: var(--bubble-radius);
    padding: var(--bubble-pad);
    margin-top: 4px;
    opacity: 0; transform: translateY(8px);
    transition: opacity .25s ease, transform .25s ease;
  }
  .tc-in { opacity: 1; transform: none; }
  .tc-fade { opacity: 0 !important; transition: opacity 1.2s ease; }
  .tc-name { font-weight: 700; }
  .tc-sep { opacity: .85; }
  .tc-time { opacity: .6; font-size: .8em; margin-inline-end: 6px; font-variant-numeric: tabular-nums; }
  .tc-badge { height: 1.05em; vertical-align: -0.18em; margin-inline-end: 4px; border-radius: 2px; }
  .tc-emote { height: 1.6em; vertical-align: middle; margin: -0.3em 1px; }
  .tc-image {
    display: block; max-width: 92%; border-radius: 8px;
    margin: 4px 0; box-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .tc-link { color: #a3b8ff; text-decoration: underline; word-break: break-all; }
  .tc-event {
    font-style: italic; opacity: .95;
    border-inline-start: 3px solid #9146FF;
    padding-inline-start: 8px;
  }
  .tc-event.tc-in { opacity: .95; }
  .tc-msg-action .tc-body { font-style: italic; }
  #hint {
    position: fixed; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background: rgba(10,10,18,.85); color: #fff;
    font-size: 15px; line-height: 1.8;
  }
  #hint code { background: rgba(255,255,255,.12); padding: 2px 6px; border-radius: 4px; direction: ltr; unicode-bidi: embed; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="chat"></div>
<div id="hint" hidden></div>

<script>/* ============================================================
   TwitchChat core engine — anonymous IRC, no auth required.
   Twitch native emotes (code-point safe = Arabic safe),
   BTTV / FFZ / 7TV emotes, global badges, image embeds.
   ============================================================ */
(function (global) {
  'use strict';

  /* ---------- Known global badge UUIDs (static-cdn.jtvnw.net) ---------- */
  var BADGES = {
    'broadcaster/1':  '5527c58c-fb7d-422d-b71b-f309dcb85cc1',

    'sub-gifter/1':   'a5ef6c17-2e5b-4d8f-9b80-2779fd722414',
    'sub-gifter/5':   'ee113e59-c839-4472-969a-1e16d20f8962',
    'sub-gifter/10':  'd333288c-65d7-4c7b-b691-cdd7b3484bf8',
    'sub-gifter/25':  '052a5d41-f1cc-455c-bc7b-fe841ffaf17f',
    'sub-gifter/50':  'c4eba5b4-17a7-40a1-a668-bc1972c1e24d',
    'sub-gifter/100': '8343ada7-3451-434e-91c4-e82bdcf54460',
    'bits/1':         '73b5c3fb-24f9-4a82-a852-2f475b59411c',
    'bits/100':       '09d93036-e7ce-431c-9a9e-7044297d4569',
    'bits/1000':      '0d85a29e-79ad-4c63-a285-3f7d263f7567',
    'bits/5000':      '57cd97fc-3e9e-4c6d-9d41-60147137234e',
    'bits/10000':     '68af213b-a771-4124-b6e3-9bb6d98aa732',
    'bits-leader/1':  '8cd6cd52-2ba3-4910-90a8-c0d7d12bf09e',
    'bits-leader/2':  'f04baac7-9141-4456-a0e7-6301bcc34138',
    'bits-leader/3':  'f1d2aab6-b647-47af-965b-84909cf303aa',
    'hype-train/1':   'fae4086c-3190-44d4-83c8-8ef0cbe1a515',
    'hype-train/2':   '9c8d038a-3a29-45ea-96d4-5031fb1a7a81',
    'artist-badge/1': '4300a897-03dc-4e83-8c0e-c332fee7057f',
    'no_audio/1':     'aef2cd08-f29b-45a1-8c12-d44d7fd5e6f0',
    'no_video/1':     '199a0dba-58f3-494e-a7fc-1fa0a1001fb8',
    'game-developer/1':'85856a4a-eb7d-4e26-a43e-d204a977ade4',
    'twitch-recap-2023/1':'8f2ada46-9e22-4f63-bd24-bb0356dec2af'
  };
  // Fallbacks when an exact badge version has no known UUID
  var BADGE_FALLBACK = {
    'subscriber': '5d9f2208-5dd8-11e7-8513-2ff4adfae661',
    'founder':    '511b78a9-ab37-472f-9569-457753bbe7d3',
    'bits':       '73b5c3fb-24f9-4a82-a852-2f475b59411c',
    'sub-gifter': 'a5ef6c17-2e5b-4d8f-9b80-2779fd722414',
    'hype-train': 'fae4086c-3190-44d4-83c8-8ef0cbe1a515',
    'bits-leader':'8cd6cd52-2ba3-4910-90a8-c0d7d12bf09e'
  };
  function badgeUrl(name, version) {
    var id = BADGES[name + '/' + version] || BADGE_FALLBACK[name];
    return id ? 'https://static-cdn.jtvnw.net/badges/v1/' + id + '/3' : null;
  }

  /* ---------- Default name colors (same palette Twitch uses) ---------- */
  var DEFAULT_COLORS = ['#FF0000','#0000FF','#00FF00','#B22222','#FF7F50','#9ACD32','#FF4500','#2E8B57','#DAA520','#D2691E','#5F9EA0','#1E90FF','#FF69B4','#8A2BE2','#00FF7F'];
  function colorFor(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return DEFAULT_COLORS[h % DEFAULT_COLORS.length];
  }
  // Lighten too-dark colors so names stay readable on dark/transparent overlays
  function readable(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return hex;
    var n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    var lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    if (lum < 80) { var k = (80 - lum) / 80; r += (255 - r) * k * 0.7; g += (255 - g) * k * 0.7; b += (255 - b) * k * 0.7; }
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }

  /* ---------- IRC tag value unescaping ---------- */
  function unescapeTag(v) {
    return v.replace(/\\(.)/g, function (_, c) {
      return c === 's' ? ' ' : c === 'n' ? '\n' : c === 'r' ? '\r' : c === ':' ? ';' : c;
    });
  }
  function parseTags(raw) {
    var tags = {};
    raw.split(';').forEach(function (p) {
      var i = p.indexOf('=');
      if (i === -1) { tags[p] = ''; return; }
      tags[p.slice(0, i)] = unescapeTag(p.slice(i + 1));
    });
    return tags;
  }
  function parseLine(line) {
    var msg = { tags: {}, prefix: '', command: '', params: [] };
    var rest = line;
    if (rest[0] === '@') { var sp = rest.indexOf(' '); msg.tags = parseTags(rest.slice(1, sp)); rest = rest.slice(sp + 1); }
    if (rest[0] === ':') { var sp2 = rest.indexOf(' '); msg.prefix = rest.slice(1, sp2); rest = rest.slice(sp2 + 1); }
    var trailingIdx = rest.indexOf(' :');
    var trailing = null;
    if (trailingIdx !== -1) { trailing = rest.slice(trailingIdx + 2); rest = rest.slice(0, trailingIdx); }
    msg.params = rest.split(' ').filter(Boolean);
    msg.command = msg.params.shift() || '';
    if (trailing !== null) msg.params.push(trailing);
    return msg;
  }

  /* ---------- Image link support ----------
     Returns a direct image URL, or null if the link isn't embeddable. */
  function toImageUrl(url) {
    var u;
    try { u = new URL(url); } catch (e) { return null; }
    if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
    var host = u.hostname.replace(/^www\./, '');
    var path = u.pathname;

    // 1) Any direct image file from any site (imgur, pinimg, discord cdn,
    //    i.redd.it, ibb, postimg, imgflip, 7tv, wikimedia, ...)
    if (/\.(png|jpe?g|gif|webp|avif|bmp)$/i.test(path)) return url;

    // 2) imgur page link -> direct image
    if (host === 'imgur.com') {
      var im = path.match(/^\/(?:gallery\/|a\/)?([A-Za-z0-9]{5,10})$/);
      if (im && path.indexOf('/a/') === -1 && path.indexOf('/gallery/') === -1)
        return 'https://i.imgur.com/' + im[1] + '.png';
    }
    if (host === 'i.imgur.com') {
      var im2 = path.match(/^\/([A-Za-z0-9]{5,10})$/);
      if (im2) return 'https://i.imgur.com/' + im2[1] + '.png';
    }

    // 3) giphy page link -> media gif
    if (host === 'giphy.com' || host === 'media.giphy.com') {
      var gm = path.match(/-([A-Za-z0-9]{8,})$/) || path.match(/\/media\/([A-Za-z0-9]+)\//);
      if (gm) return 'https://media.giphy.com/media/' + gm[1] + '/giphy.gif';
    }

    // 4) tenor direct media (c.tenor.com / media.tenor.com without extension)
    if (host === 'c.tenor.com' || host === 'media.tenor.com' || host === 'media1.tenor.com') {
      return url; // tenor media URLs render as images even without extension
    }

    // 5) Pinterest direct CDN (page pins can't be resolved client-side)
    if (host === 'i.pinimg.com') return url;

    // 6) Dropbox share link -> raw
    if (host === 'dropbox.com' || host === 'dl.dropboxusercontent.com') {
      if (/\.(png|jpe?g|gif|webp)/i.test(path)) {
        u.searchParams.set('raw', '1'); u.searchParams.delete('dl');
        return u.toString();
      }
    }

    // 7) Unsplash direct
    if (host === 'images.unsplash.com' || host === 'unsplash.com' && /^\/photos\//.test(path) === false) {
      if (host === 'images.unsplash.com') return url;
    }
    return null;
  }
  var URL_RE = /(https?:\/\/[^\s]+)/g;

  /* ---------- Code-point safe Twitch emote segmentation ----------
     Twitch emote ranges are indexed by Unicode CODE POINTS, so all
     slicing here uses Array.from(). This is what keeps Arabic text,
     diacritics and emoji from ever shifting or corrupting. */
  function segment(text, emotesTag) {
    var cps = Array.from(text);
    var ranges = [];
    if (emotesTag) {
      emotesTag.split('/').forEach(function (part) {
        var ci = part.indexOf(':');
        if (ci === -1) return;
        var id = part.slice(0, ci);
        part.slice(ci + 1).split(',').forEach(function (r) {
          var se = r.split('-');
          var s = +se[0], e = +se[1];
          if (!isNaN(s) && !isNaN(e)) ranges.push({ s: s, e: e, id: id });
        });
      });
      ranges.sort(function (a, b) { return a.s - b.s; });
    }
    var segs = [], pos = 0;
    ranges.forEach(function (r) {
      if (r.s >= cps.length) return;
      if (r.s > pos) segs.push({ t: 'text', text: cps.slice(pos, r.s).join('') });
      segs.push({ t: 'emote', id: r.id, name: cps.slice(r.s, r.e + 1).join('') });
      pos = r.e + 1;
    });
    if (pos < cps.length) segs.push({ t: 'text', text: cps.slice(pos).join('') });
    if (!segs.length) segs.push({ t: 'text', text: text });
    return segs;
  }

  /* ---------- Third-party emotes (BTTV / FFZ / 7TV) ---------- */
  function fetchJSON(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw 0; return r.json(); });
  }

  /* ============================ ENGINE ============================ */
  function TwitchChat(opts) {
    this.opts = Object.assign({
      channel: '',
      container: null,
      maxMessages: 60,
      showBadges: true,
      showTimestamps: false,
      embedImages: true,
      thirdPartyEmotes: true,
      showEvents: true,        // subs / raids / announcements
      fadeAfter: 0,            // seconds; 0 = never fade
      align: 'auto',           // auto | ltr | rtl
      maxImageHeight: 220,
      token: '',               // OAuth token (with or without "oauth:" prefix)
      login: '',               // Twitch username matching the token
      clientId: '',            // client id from token validation (for Helix badges)
      onStatus: function () {}
    }, opts);
    this.ws = null;
    this.emotes3p = {};        // name -> {url, provider}
    this.badgeMap = {};        // exact badges from Helix when logged in
    this.selfTags = null;      // own USERSTATE tags (badges/color/display-name)
    this.roomId = null;
    this.alive = false;
    this._reconnectDelay = 1000;
  }

  TwitchChat.prototype.connect = function () {
    var self = this, o = this.opts;
    if (!o.channel) { o.onStatus('no-channel'); return; }
    this.disconnect();
    this.alive = true;
    o.onStatus('connecting');
    var ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    this.ws = ws;
    ws.onopen = function () {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      if (o.token && o.login) {
        ws.send('PASS oauth:' + o.token.replace(/^oauth:/, ''));
        ws.send('NICK ' + o.login.toLowerCase());
      } else {
        ws.send('PASS SCHMOOPIIE');
        ws.send('NICK justinfan' + (10000 + (Math.random() * 80000 | 0)));
      }
      ws.send('JOIN #' + o.channel.toLowerCase().replace(/^#/, ''));
    };
    ws.onmessage = function (ev) {
      ev.data.split('\r\n').forEach(function (line) {
        if (!line) return;
        if (line.indexOf('PING') === 0) { ws.send('PONG :tmi.twitch.tv'); return; }
        self._handle(parseLine(line));
      });
    };
    ws.onclose = function () {
      if (!self.alive) return;
      self.opts.onStatus('reconnecting');
      setTimeout(function () { if (self.alive) self.connect(); }, self._reconnectDelay);
      self._reconnectDelay = Math.min(self._reconnectDelay * 2, 15000);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  };

  TwitchChat.prototype.disconnect = function () {
    this.alive = false;
    if (this.ws) { try { this.ws.close(); } catch (e) {} this.ws = null; }
  };

  TwitchChat.prototype._handle = function (m) {
    var o = this.opts;
    switch (m.command) {
      case '001': o.onStatus('connected'); this._reconnectDelay = 1000; break;
      case 'USERSTATE':
      case 'GLOBALUSERSTATE':
        this.selfTags = Object.assign({}, this.selfTags || {}, m.tags);
        break;
      case 'ROOMSTATE':
        if (m.tags['room-id'] && m.tags['room-id'] !== this.roomId) {
          this.roomId = m.tags['room-id'];
          if (o.thirdPartyEmotes) this._load3p(this.roomId);
          if (o.token && o.clientId) this._loadHelixBadges(this.roomId);
        }
        break;
      case 'PRIVMSG':
        this._renderMessage(m.tags, m.params[1] || '', false);
        break;
      case 'USERNOTICE': // subs, resubs, raids, gifts, announcements
        if (o.showEvents) {
          var sys = m.tags['system-msg'];
          if (sys) this._renderEvent(sys, m.tags);
          if (m.params[1]) this._renderMessage(m.tags, m.params[1], true);
        }
        break;
      case 'CLEARMSG': {
        var id = m.tags['target-msg-id'];
        if (id) { var el = o.container.querySelector('[data-msgid="' + id + '"]'); if (el) el.remove(); }
        break;
      }
      case 'CLEARCHAT': {
        var user = m.params[1];
        if (user) {
          o.container.querySelectorAll('[data-user="' + user.toLowerCase() + '"]').forEach(function (n) { n.remove(); });
        } else {
          o.container.innerHTML = '';
        }
        break;
      }
      case 'NOTICE':
        if (m.params[1] && /authentication failed|improperly formatted/i.test(m.params[1])) {
          this.alive = false;            // bad token — don't reconnect-spam
          o.onStatus('error:' + m.params[1]);
        } else if (m.params[1] && /login|suspended|banned/i.test(m.params[1])) {
          o.onStatus('error:' + m.params[1]);
        }
        break;
    }
  };

  TwitchChat.prototype._load3p = function (roomId) {
    var map = this.emotes3p;
    function add(name, url, provider) { map[name] = { url: url, provider: provider }; }
    // BTTV
    fetchJSON('https://api.betterttv.net/3/cached/emotes/global').then(function (list) {
      list.forEach(function (e) { add(e.code, 'https://cdn.betterttv.net/emote/' + e.id + '/2x', 'BTTV'); });
    }).catch(function () {});
    fetchJSON('https://api.betterttv.net/3/cached/users/twitch/' + roomId).then(function (d) {
      (d.channelEmotes || []).concat(d.sharedEmotes || []).forEach(function (e) {
        add(e.code, 'https://cdn.betterttv.net/emote/' + e.id + '/2x', 'BTTV');
      });
    }).catch(function () {});
    // FFZ
    fetchJSON('https://api.frankerfacez.com/v1/set/global').then(function (d) {
      Object.keys(d.sets || {}).forEach(function (k) {
        (d.sets[k].emoticons || []).forEach(function (e) {
          var u = e.urls['2'] || e.urls['1'];
          if (u) add(e.name, u.indexOf('http') === 0 ? u : 'https:' + u, 'FFZ');
        });
      });
    }).catch(function () {});
    fetchJSON('https://api.frankerfacez.com/v1/room/id/' + roomId).then(function (d) {
      Object.keys(d.sets || {}).forEach(function (k) {
        (d.sets[k].emoticons || []).forEach(function (e) {
          var u = e.urls['2'] || e.urls['1'];
          if (u) add(e.name, u.indexOf('http') === 0 ? u : 'https:' + u, 'FFZ');
        });
      });
    }).catch(function () {});
    // 7TV
    fetchJSON('https://7tv.io/v3/emote-sets/global').then(function (d) {
      (d.emotes || []).forEach(function (e) { add(e.name, 'https://cdn.7tv.app/emote/' + e.id + '/2x.webp', '7TV'); });
    }).catch(function () {});
    fetchJSON('https://7tv.io/v3/users/twitch/' + roomId).then(function (d) {
      var set = d.emote_set && d.emote_set.emotes;
      (set || []).forEach(function (e) { add(e.name, 'https://cdn.7tv.app/emote/' + e.id + '/2x.webp', '7TV'); });
    }).catch(function () {});
  };

  /* ---------- DOM builders (textContent only — no injection) ---------- */
  function el(tag, cls) { var n = document.createElement(tag); if (cls) n.className = cls; return n; }

  TwitchChat.prototype._appendTextTokens = function (parent, text) {
    var o = this.opts, e3 = this.emotes3p;
    var parts = text.split(/(\s+)/);
    for (var i = 0; i < parts.length; i++) {
      var tok = parts[i];
      if (!tok) continue;
      if (/^\s+$/.test(tok)) { parent.appendChild(document.createTextNode(tok)); continue; }
      // third-party emote?
      if (o.thirdPartyEmotes && e3[tok]) {
        var img = el('img', 'tc-emote');
        img.src = e3[tok].url; img.alt = tok; img.title = tok + ' (' + e3[tok].provider + ')';
        img.loading = 'lazy';
        parent.appendChild(img);
        continue;
      }
      // URL?
      if (/^https?:\/\//i.test(tok)) {
        var imgUrl = o.embedImages ? toImageUrl(tok) : null;
        if (imgUrl) {
          var wrap = el('span', 'tc-imgwrap');
          var pic = el('img', 'tc-image');
          pic.src = imgUrl; pic.alt = ''; pic.loading = 'lazy';
          pic.style.maxHeight = o.maxImageHeight + 'px';
          pic.onerror = (function (w, original) {
            return function () { // broken image -> fall back to a plain link
              w.innerHTML = '';
              var a = el('a', 'tc-link'); a.href = original; a.target = '_blank';
              a.rel = 'noopener noreferrer'; a.textContent = original;
              w.appendChild(a);
            };
          })(wrap, tok);
          var container = o.container;
          pic.onload = function () { container.scrollTop = container.scrollHeight; };
          wrap.appendChild(pic);
          parent.appendChild(wrap);
        } else {
          var a = el('a', 'tc-link');
          a.href = tok; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.textContent = tok;
          parent.appendChild(a);
        }
        continue;
      }
      parent.appendChild(document.createTextNode(tok));
    }
  };

  TwitchChat.prototype._renderMessage = function (tags, text, isEvent) {
    var o = this.opts;
    var isAction = false;
    var am = text.match(/^\u0001ACTION (.*)\u0001$/);
    if (am) { isAction = true; text = am[1]; }

    var row = el('div', 'tc-msg' + (isEvent ? ' tc-msg-event' : '') + (isAction ? ' tc-msg-action' : ''));
    if (tags.id) row.dataset.msgid = tags.id;
    var login = (tags['display-name'] || '').toLowerCase() || (tags.login || '');
    row.dataset.user = login;
    if (o.align !== 'ltr' && o.align !== 'rtl') row.dir = 'auto'; else row.dir = o.align;

    if (o.showTimestamps) {
      var ts = el('span', 'tc-time');
      var d = new Date();
      ts.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
      row.appendChild(ts);
    }

    if (o.showBadges && tags.badges) {
      var self = this;
      tags.badges.split(',').forEach(function (b) {
        var nv = b.split('/');
        var url = self._badgeUrl(nv[0], nv[1]);
        if (!url) return;
        var bi = el('img', 'tc-badge');
        bi.src = url; bi.alt = nv[0];
        bi.onerror = function () { bi.remove(); };
        var info = (tags['badge-info'] || '').split(',').find(function (x) { return x.indexOf(nv[0] + '/') === 0; });
        bi.title = nv[0] + (info ? ' (' + info.split('/')[1] + ' months)' : '');
        row.appendChild(bi);
      });
    }

    var name = el('span', 'tc-name');
    name.textContent = tags['display-name'] || login || '???';
    name.style.color = readable(tags.color || colorFor(name.textContent));
    name.dir = 'ltr';
    row.appendChild(name);

    if (!isAction) {
      var sep = el('span', 'tc-sep');
      sep.textContent = ':';
      row.appendChild(sep);
    }
    row.appendChild(document.createTextNode(' '));

    var body = el('span', 'tc-body');
    body.dir = 'auto';
    if (isAction) body.style.color = name.style.color;
    var segs = segment(text, tags.emotes);
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (s.t === 'emote') {
        var img = el('img', 'tc-emote');
        img.src = 'https://static-cdn.jtvnw.net/emoticons/v2/' + s.id + '/default/dark/2.0';
        img.alt = s.name; img.title = s.name;
        body.appendChild(img);
      } else {
        this._appendTextTokens(body, s.text);
      }
    }
    row.appendChild(body);
    this._push(row);
  };

  TwitchChat.prototype._renderEvent = function (sysMsg, tags) {
    var row = el('div', 'tc-event');
    row.dir = 'auto';
    if (tags.id) row.dataset.msgid = tags.id + '-sys';
    row.textContent = sysMsg;
    this._push(row);
  };

  TwitchChat.prototype._push = function (row) {
    var o = this.opts, c = o.container;
    c.appendChild(row);
    requestAnimationFrame(function () { row.classList.add('tc-in'); });
    while (c.children.length > o.maxMessages) c.removeChild(c.firstChild);
    c.scrollTop = c.scrollHeight;
    if (o.fadeAfter > 0) {
      setTimeout(function () {
        row.classList.add('tc-fade');
        setTimeout(function () { if (row.parentNode) row.remove(); }, 1200);
      }, o.fadeAfter * 1000);
    }
  };

  /* ---------- send a message (requires login) ----------
     Twitch doesn't echo your own PRIVMSG back, so we render it
     locally using the badges/color from our USERSTATE tags. */
  TwitchChat.prototype.send = function (text) {
    if (!this.ws || this.ws.readyState !== 1 || !this.opts.login) return false;
    text = String(text).replace(/[\r\n]+/g, ' ').trim();
    if (!text) return false;
    var chan = this.opts.channel.toLowerCase().replace(/^#/, '');
    this.ws.send('PRIVMSG #' + chan + ' :' + text);
    var tags = Object.assign({}, this.selfTags || {});
    delete tags.emotes;                       // USERSTATE has emote-sets, not message emotes
    if (!tags['display-name']) tags['display-name'] = this.opts.login;
    this._renderMessage(tags, text, false);
    return true;
  };

  /* ---------- exact badges via Helix (logged-in only) ----------
     Replaces the static UUID map with the real global + channel set,
     including the channel's custom subscriber badge art. */
  TwitchChat.prototype._loadHelixBadges = function (broadcasterId) {
    var self = this;
    var h = {
      'Authorization': 'Bearer ' + this.opts.token.replace(/^oauth:/, ''),
      'Client-Id': this.opts.clientId
    };
    function ingest(d) {
      (d.data || []).forEach(function (set) {
        (set.versions || []).forEach(function (v) {
          self.badgeMap[set.set_id + '/' + v.id] = v.image_url_2x || v.image_url_1x;
        });
      });
    }
    fetch('https://api.twitch.tv/helix/chat/badges/global', { headers: h })
      .then(function (r) { return r.json(); }).then(ingest).catch(function () {});
    fetch('https://api.twitch.tv/helix/chat/badges?broadcaster_id=' + broadcasterId, { headers: h })
      .then(function (r) { return r.json(); }).then(ingest).catch(function () {});
  };

  TwitchChat.prototype._badgeUrl = function (name, version) {
    return this.badgeMap[name + '/' + version] || badgeUrl(name, version);
  };

  /* ---------- token validation helper ----------
     Resolves {login, client_id, user_id, expires_in} or rejects. */
  TwitchChat.validateToken = function (token) {
    token = String(token || '').replace(/^oauth:/, '').trim();
    return fetch('https://id.twitch.tv/oauth2/validate', {
      headers: { 'Authorization': 'OAuth ' + token }
    }).then(function (r) {
      if (!r.ok) throw new Error('Token is invalid or expired');
      return r.json();
    });
  };

  global.TwitchChat = TwitchChat;
})(window);
</script>

<script>
(function () {
  var P = new URLSearchParams(location.search);
  function flag(name, def) {
    var v = P.get(name);
    if (v === null) return def;
    return !(v === '0' || v === 'false' || v === 'no');
  }
  var channel = (P.get('channel') || '').trim();

  /* ---- background: transparent (default) | css color | image URL ---- */
  var bg = P.get('bg') || 'transparent';
  var bgEl = document.getElementById('bg');
  if (bg !== 'transparent' && bg !== '') {
    if (/^https?:\/\//i.test(bg)) bgEl.style.backgroundImage = 'url("' + bg.replace(/"/g, '') + '")';
    else bgEl.style.background = bg;        // #18181b, rgba(...), green, etc.
    bgEl.style.opacity = P.get('bgopacity') || '1';
  }

  /* ---- style params ---- */
  var r = document.documentElement.style;
  if (P.get('size'))  r.setProperty('--font-size', parseInt(P.get('size'), 10) + 'px');
  if (P.get('color')) r.setProperty('--text-color', '#' + P.get('color').replace('#', ''));
  if (!flag('shadow', true)) r.setProperty('--shadow', 'none');
  if (flag('bubbles', false)) {
    r.setProperty('--bubble-bg', P.get('bubblecolor') ? '#' + P.get('bubblecolor').replace('#','') : 'rgba(0,0,0,.55)');
    r.setProperty('--bubble-radius', '10px');
    r.setProperty('--bubble-pad', '6px 10px');
  }
  if (P.get('font')) document.body.style.fontFamily = "'" + P.get('font') + "', 'Inter', 'Noto Sans Arabic', sans-serif";
  if (flag('bold', false)) document.body.style.fontWeight = '600';

  if (!channel) {
    var h = document.getElementById('hint');
    h.hidden = false;
    h.innerHTML = '<div><b>Rusty Fabled Chat — OBS Source</b><br><br>' +
      'Add <code>?channel=YOUR_CHANNEL</code> to the URL of this Browser Source.<br><br>' +
      'Optional: <code>&bg=%2318181b</code> or image URL · <code>&size=20</code> · <code>&color=ffffff</code> · ' +
      '<code>&fade=30</code> · <code>&badges=0</code> · <code>&images=0</code> · <code>&emotes=0</code> · ' +
      '<code>&ts=1</code> · <code>&limit=50</code> · <code>&align=auto|ltr|rtl</code> · <code>&bubbles=1</code> · <code>&shadow=0</code> · <code>&token=...</code> (exact badges)</div>';
    return;
  }

  function start(auth) {
    var chat = new TwitchChat({
      channel: channel,
      container: document.getElementById('chat'),
      maxMessages: parseInt(P.get('limit') || '50', 10),
      showBadges: flag('badges', true),
      showTimestamps: flag('ts', false),
      embedImages: flag('images', true),
      thirdPartyEmotes: flag('emotes', true),
      showEvents: flag('events', true),
      fadeAfter: parseInt(P.get('fade') || '0', 10),
      align: P.get('align') || 'auto',
      maxImageHeight: parseInt(P.get('imgheight') || '220', 10),
      token: auth ? auth.token : '',
      login: auth ? auth.login : '',
      clientId: auth ? auth.clientId : '',
      onStatus: function (s) { console.log('[chat]', s); }
    });
    chat.connect();
  }

  // Optional &token= -> validate, connect as that account and load exact
  // channel badges from Helix. Falls back to anonymous if invalid/expired.
  var token = (P.get('token') || '').replace(/^oauth:/, '').trim();
  if (token) {
    TwitchChat.validateToken(token).then(function (d) {
      start({ token: token, login: d.login, clientId: d.client_id });
    }).catch(function () {
      console.warn('[chat] token invalid/expired — connecting anonymously');
      start(null);
    });
  } else {
    start(null);
  }
})();
</script>
</body>
</html>
